<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre completo</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let member of members; trackBy: trackById" (click)="select(member)">
        <td>{{ member.id }}</td>
        <td>{{ member.fullName }}</td>
        <td>{{ member.email }}</td>
        <td>{{ member.phone || '—' }}</td>
        <td>
          <span class="badge" [class.bg-success]="member.active" [class.bg-secondary]="!member.active">
            {{ member.active ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <button
            type="button"
            class="btn btn-sm btn-outline-primary"
            (click)="select(member); $event.stopPropagation()"
          >
            Ver detalle
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<p class="text-muted" *ngIf="members.length === 0">No hay socios registrados</p>
