@if (member) {
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>{{ member.fullName }}</strong>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="close()">Cerrar</button>
    </div>
    <div class="card-body">
      <p class="card-text mb-1"><strong>Correo electrónico:</strong> {{ member.email }}</p>
      <p class="card-text mb-1"><strong>Teléfono:</strong> {{ member.phone || '—' }}</p>
      <p class="card-text mb-0">
        <strong>Estado:</strong>
        <span class="badge" [class.bg-success]="member.active" [class.bg-secondary]="!member.active">
          {{ member.active ? 'Activo' : 'Inactivo' }}
        </span>
      </p>
    </div>
  </div>
}
