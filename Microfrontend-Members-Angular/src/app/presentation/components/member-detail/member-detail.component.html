@if (member) {
  <section class="mt-6 p-6 border border-gray-200 rounded-lg bg-gray-50">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900">{{ member.fullName }}</h2>
      <button
        type="button"
        class="text-sm font-medium text-gray-500 hover:text-gray-700 bg-transparent border-0 p-0 cursor-pointer transition"
        (click)="close()"
      >
        Cerrar
      </button>
    </div>

    <dl class="grid grid-cols-1 gap-2 text-sm">
      <dt class="font-medium text-gray-500">Correo electrónico</dt>
      <dd class="text-gray-900 mb-2">{{ member.email }}</dd>

      <dt class="font-medium text-gray-500">Teléfono</dt>
      <dd class="text-gray-900 mb-2">{{ member.phone || '—' }}</dd>

      <dt class="font-medium text-gray-500">Estado</dt>
      <dd class="text-gray-900">
        <span class="badge" [class.active]="member.active">{{ member.active ? 'Activo' : 'Inactivo' }}</span>
      </dd>
    </dl>
  </section>
}
